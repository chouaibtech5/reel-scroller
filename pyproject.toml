[project]
name = "reel-scroller"
version = "0.2.0"
description = "Have a local AI model watch the Instagram reels you saved and write structured notes. Windows, Linux and macOS; analysis is local."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Bruce" }, { name = "Chouaib" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "psutil>=6.0",
    "faster-whisper>=1.1",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "yt-dlp>=2026.1",
]

[project.optional-dependencies]
mac = [
    "mlx-vlm>=0.7.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]
cuda = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
reel-scroller = "reel_scroller.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_scroller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
